<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Verify OTP - AI Scheduler</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            #eff6ff,
            #f0fdf4
        );
}

.container {

    width: 400px;

    max-width: 92%;

    background: white;

    padding: 35px;

    border-radius: 15px;

    text-align: center;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,0.12);
}

.icon {

    font-size: 50px;

    margin-bottom: 10px;
}

h1 {

    margin: 0;

    color: #111827;

    font-size: 25px;
}

p {

    color: #6b7280;

    line-height: 1.6;
}

.otp-input {

    width: 100%;

    padding: 15px;

    border:
        1px solid #d1d5db;

    border-radius: 8px;

    font-size: 25px;

    text-align: center;

    letter-spacing: 8px;

    margin:
        20px 0;

    outline: none;
}

.otp-input:focus {

    border-color: #2563eb;
}

button {

    width: 100%;

    padding: 13px;

    border: none;

    border-radius: 8px;

    background: #2563eb;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}

button:hover {

    background: #1d4ed8;
}

.back {

    margin-top: 15px;

    background: #6b7280;
}

#message {

    margin-top: 18px;

    font-weight: bold;

    line-height: 1.5;
}

.info {

    margin-top: 20px;

    background: #eff6ff;

    border-left:
        4px solid #2563eb;

    padding: 12px;

    text-align: left;

    font-size: 13px;

    color: #1e3a8a;
}

</style>

</head>

<body>


<div class="container">

    <div class="icon">
        📧
    </div>

    <h1>
        Verify Your Email
    </h1>

    <p>

        A 6-digit OTP has been sent to
        your registered email.

    </p>


    <form id="otpForm">

        <input
            class="otp-input"
            type="text"
            id="otp"
            maxlength="6"
            pattern="[0-9]{6}"
            placeholder="000000"
            required
        >


        <button type="submit">

            ✓ Verify OTP

        </button>

    </form>


    <button
        class="back"
        onclick="goBack()">

        ← Back to Login

    </button>


    <div id="message"></div>


    <div class="info">

        <b>Security:</b>

        <br><br>

        Your OTP is valid for 5 minutes
        and can only be used once.

    </div>

</div>


<script>


// ========================================================
// OTP INPUT
// ========================================================

document
    .getElementById("otp")
    .addEventListener(
        "input",
        function() {

            this.value =
                this.value
                .replace(
                    /[^0-9]/g,
                    ""
                );

        }
    );


// ========================================================
// VERIFY OTP
// ========================================================

document
    .getElementById("otpForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const otp =
                document
                .getElementById("otp")
                .value
                .trim();


            const message =
                document
                .getElementById("message");


            if (
                otp.length !== 6
            ) {

                message.style.color =
                    "#dc2626";

                message.innerText =
                    "Please enter the 6-digit OTP.";

                return;
            }


            message.style.color =
                "#2563eb";

            message.innerText =
                "Verifying OTP...";


            try {

                const response =
                    await fetch(
                        "/verify-otp",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    otp:
                                        otp

                                })

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    message.style.color =
                        "#dc2626";

                    message.innerText =
                        "✗ " +
                        data.message;

                    return;
                }


                message.style.color =
                    "#16a34a";

                message.innerText =
                    "✓ OTP verified successfully!";


                setTimeout(
                    function() {

                        window.location.href =
                            data.redirect;

                    },
                    700
                );

            }

            catch (error) {

                message.style.color =
                    "#dc2626";

                message.innerText =
                    "Server connection failed.";

                console.error(error);

            }

        }
    );


// ========================================================
// BACK
// ========================================================

function goBack() {

    window.location.href =
        "/login";

}

</script>

</body>

</html>
